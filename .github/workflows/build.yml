name: Build ImmortalWrt 25.12

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 进行 menuconfig'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release:
        description: '编译完成后发布 Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        ref: openwrt-25.12
        fetch-depth: 0

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses5-dev libncursesw5-dev libssl-dev \
          python3-setuptools python3-dev \
          python3-pkg-resources swig rsync unzip zlib1g-dev \
          file wget libelf-dev libtool-bin ecj fastjar \
          java-propose-classpath python3-pyelftools \
          xsltproc mkisofs protobuf-compiler

    # =====================================================
    # 1. 添加 feeds 源（只加必要的）
    # =====================================================
    - name: 更新 Feeds
      run: |
        # 清空 feeds 配置，避免重复
        > feeds.conf.default
        echo "src-git turboacc https://github.com/chenmozhijin/luci-app-turboacc.git" >> feeds.conf.default
        echo "src-git mosdns https://github.com/sbwml/luci-app-mosdns.git" >> feeds.conf.default
        ./scripts/feeds update -a

        # 只安装我们明确需要的包，绝不使用 install -a
        ./scripts/feeds install luci-app-turboacc
        ./scripts/feeds install luci-app-mosdns

    - name: 缓存
      uses: actions/cache@v4
      with:
        path: |
          dl
          .ccache
        key: ${{ runner.os }}-iwrt25-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-iwrt25-

    # =====================================================
    # 2. 强制删除 luci-app-mosdns 自带的 init 脚本（避免覆盖冲突）
    # =====================================================
    - name: 修复 mosdns 文件冲突（必须执行）
      run: |
        # 删除界面包中的启动脚本，仅保留 mosdns 本体提供的
        find package/feeds/mosdns/luci-app-mosdns -type f -path "*/init.d/mosdns" -exec rm -f {} \;
        # 同时删除可能存在的目录，确保彻底
        find package/feeds/mosdns/luci-app-mosdns -type d -path "*/init.d" -empty -delete 2>/dev/null || true

    # =====================================================
    # 3. 生成 .config（只选界面，依赖自动拉取 mosdns）
    # =====================================================
    - name: 加载配置
      run: |
        # 彻底清除旧配置
        rm -f .config
        touch .config

        # 启用 turboacc
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        # 启用 mosdns 界面（其依赖会自动选中 mosdns 本体）
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config

        # turboacc 的细项配置（维持原样）
        echo "# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_DRV is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_FULLCONE_NAT is not set" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y" >> .config

        # 关键：不要手动设置 CONFIG_PACKAGE_mosdns 或 v2dat，让依赖自动处理
        # 但为了保险，明确取消可能冲突的独立选项（如果它们已被默认选中，这里会覆盖）
        echo "# CONFIG_PACKAGE_mosdns is not set" >> .config
        echo "# CONFIG_PACKAGE_v2dat is not set" >> .config

        make defconfig

        # 验证：确保 mosdns 仍被依赖选中（但不应该出现两个包冲突）
        echo "===== 检查最终配置 ====="
        grep "CONFIG_PACKAGE_mosdns" .config || true
        grep "CONFIG_PACKAGE_luci-app-mosdns" .config || true

    - name: SSH 连接（调试用）
      if: github.event.inputs.ssh == 'true'
      uses: owenthereal/action-upterm@v1
      timeout-minutes: 30
      with: 
        limit-access-to-actor: true
    
    - name: 下载
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译
      run: make -j$(nproc) V=s

    - name: 整理输出
      run: |
        mkdir -p output
        cp -r bin/targets/*/*/* output/ 2>/dev/null || true
        ls -lh output/

    - name: 上传 Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.run_number }}
        path: output/

    - name: 发布 Release
      if: github.event.inputs.release == 'true' && always()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: ImmortalWrt 25.12 Build ${{ github.run_number }}
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
