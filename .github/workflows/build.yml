name: Build ImmortalWrt 25.12

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 进行 menuconfig'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release:
        description: '编译完成后发布 Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        ref: openwrt-25.12
        fetch-depth: 0

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses5-dev libncursesw5-dev libssl-dev \
          python3-setuptools python3-dev \
          python3-pkg-resources swig rsync unzip zlib1g-dev \
          file wget libelf-dev libtool-bin ecj fastjar \
          java-propose-classpath python3-pyelftools \
          xsltproc mkisofs

    # ========== 添加第三方 Feeds ==========
    - name: 更新 Feeds
      run: |
        echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default
        echo "src-git turboacc https://github.com/chenmozhijin/luci-app-turboacc.git" >> feeds.conf.default
        echo "src-git smartdns https://github.com/pymumu/luci-app-smartdns.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install -f -p openclash luci-app-openclash
        ./scripts/feeds install -f -p turboacc luci-app-turboacc
        ./scripts/feeds install -f -p smartdns luci-app-smartdns

    - name: 缓存
      uses: actions/cache@v4
      with:
        path: |
          dl
          .ccache
        key: ${{ runner.os }}-iwrt25-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-iwrt25-

    # ========== 自动选中插件 ==========
    - name: 加载配置或生成默认
      run: |
        if [ -f "config/.config" ]; then
          cp config/.config .config
        else
          touch .config
        fi
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-smartdns=y" >> .config
        make defconfig

    - name: SSH 连接
      if: github.event.inputs.ssh == 'true'
      uses: owenthereal/action-upterm@v1
      timeout-minutes: 30
      with: 
        limit-access-to-actor: true
    
    - name: 下载
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译
      run: make -j$(nproc) V=s

    - name: 整理输出
      run: |
        mkdir -p output
        cp -r bin/targets/*/*/* output/ 2>/dev/null || true
        ls -lh output/

    - name: 上传 Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.run_number }}
        path: output/

    - name: 发布 Release
      if: github.event.inputs.release == 'true' && always()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: ImmortalWrt 25.12 Build ${{ github.run_number }}
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
