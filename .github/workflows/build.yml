name: Build ImmortalWrt 25.12

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 进行 menuconfig'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release:
        description: '编译完成后发布 Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        ref: openwrt-25.12
        fetch-depth: 0

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses5-dev libncursesw5-dev libssl-dev \
          python3-setuptools python3-dev \
          python3-pkg-resources swig rsync unzip zlib1g-dev \
          file wget libelf-dev libtool-bin ecj fastjar \
          java-propose-classpath python3-pyelftools \
          xsltproc mkisofs protobuf-compiler

    # =====================================================
    # 1. 添加 feeds 源（只加必要的）
    # =====================================================
    - name: 更新 Feeds
      run: |
        > feeds.conf.default
        echo "src-git turboacc https://github.com/chenmozhijin/luci-app-turboacc.git" >> feeds.conf.default
        echo "src-git mosdns https://github.com/sbwml/luci-app-mosdns.git" >> feeds.conf.default
        ./scripts/feeds update -a
        # 只安装我们明确需要的包，绝不使用 install -a
        ./scripts/feeds install luci-app-turboacc
        ./scripts/feeds install luci-app-mosdns

    - name: 缓存
      uses: actions/cache@v4
      with:
        path: |
          dl
          .ccache
        key: ${{ runner.os }}-iwrt25-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-iwrt25-

    # =====================================================
    # 2. 强制删除 luci-app-mosdns 自带的 init 脚本（避免覆盖冲突）
    # =====================================================
    - name: 修复 mosdns 文件冲突（必须执行）
      run: |
        # 删除界面包中的启动脚本，仅保留 mosdns 本体提供的
        find package/feeds/mosdns/luci-app-mosdns -type f -path "*/init.d/mosdns" -exec rm -f {} \;
        # 删除空目录
        find package/feeds/mosdns/luci-app-mosdns -type d -path "*/init.d" -empty -delete 2>/dev/null || true

    # =====================================================
    # 3. 加载配置（保留原有配置，只调整 mosdns 相关项）
    # =====================================================
    - name: 加载配置
      run: |
        # 如果有预设配置则复制，否则创建空文件
        if [ -f "config/.config" ]; then
          cp config/.config .config
        else
          touch .config
        fi

        # 修改 mosdns 相关选项：确保界面启用，本体由依赖自动拉取，但避免显式选中冲突
        # 使用 sed 修改现有配置项，如果不存在则追加
        # 1) 确保 CONFIG_PACKAGE_luci-app-mosdns=y
        if grep -q "^CONFIG_PACKAGE_luci-app-mosdns=" .config; then
          sed -i 's/^CONFIG_PACKAGE_luci-app-mosdns=.*/CONFIG_PACKAGE_luci-app-mosdns=y/' .config
        else
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        fi

        # 2) 取消独立 mosdns 包（如果存在则注释掉，否则追加注释）
        if grep -q "^CONFIG_PACKAGE_mosdns=" .config; then
          sed -i 's/^CONFIG_PACKAGE_mosdns=.*/# CONFIG_PACKAGE_mosdns is not set/' .config
        else
          echo "# CONFIG_PACKAGE_mosdns is not set" >> .config
        fi

        # 3) 同样处理 v2dat（可选）
        if grep -q "^CONFIG_PACKAGE_v2dat=" .config; then
          sed -i 's/^CONFIG_PACKAGE_v2dat=.*/# CONFIG_PACKAGE_v2dat is not set/' .config
        else
          echo "# CONFIG_PACKAGE_v2dat is not set" >> .config
        fi

        # 4) 确保 turboacc 配置（如果原有有，则不覆盖，只补充缺失的）
        # 先检查是否存在，若不存在则追加（但原有的应该保留）
        grep -q "^CONFIG_PACKAGE_luci-app-turboacc=" .config || echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        # 以下细化选项，如果不存在则追加（但不要覆盖原有）
        grep -q "^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=" .config || echo "CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y" >> .config
        grep -q "^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=" .config || echo "CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y" >> .config
        # 禁用 SFE 等（如果存在则改为注释，不存在则追加注释）
        for opt in SHORTCUT_FE SHORTCUT_FE_CM SHORTCUT_FE_DRV FULLCONE_NAT; do
          if grep -q "^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_${opt}=" .config; then
            sed -i "s/^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_${opt}=.*/# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_${opt} is not set/" .config
          else
            echo "# CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_${opt} is not set" >> .config
          fi
        done

        # 运行 defconfig 自动处理依赖（保留所有用户配置，只修正依赖）
        make defconfig

        # 打印确认信息
        echo "===== 最终 mosdns 相关配置 ====="
        grep -E "CONFIG_PACKAGE_(mosdns|luci-app-mosdns|v2dat)" .config || true

    - name: SSH 连接（调试用）
      if: github.event.inputs.ssh == 'true'
      uses: owenthereal/action-upterm@v1
      timeout-minutes: 30
      with: 
        limit-access-to-actor: true
    
    - name: 下载
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译
      run: make -j$(nproc) V=s

    - name: 整理输出
      run: |
        mkdir -p output
        cp -r bin/targets/*/*/* output/ 2>/dev/null || true
        ls -lh output/

    - name: 上传 Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ github.run_number }}
        path: output/

    - name: 发布 Release
      if: github.event.inputs.release == 'true' && always()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: ImmortalWrt 25.12 Build ${{ github.run_number }}
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
